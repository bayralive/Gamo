name: Imperial Production Deploy

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 🚀 1. COMPILE CUSTOMER APP (PLAY STORE BUNDLE)
    - name: Build Customer App Bundle
      run: ./gradlew :apps:customer-app:bundleRelease --stacktrace

    # 🚖 2. COMPILE DRIVER APP (PLAY STORE BUNDLE + DIRECT APK)
    - name: Build Driver App Bundle & APK
      run: ./gradlew :apps:driver-app:bundleRelease :apps:driver-app:assembleRelease --stacktrace || ./gradlew :apps:driver-app:bundleRelease --stacktrace

    # 📦 3. UPLOAD CUSTOMER AAB
    - name: Upload Customer App Bundle
      uses: actions/upload-artifact@v4
      with:
        name: customer-app-release-aab
        path: apps/customer-app/build/outputs/bundle/release/*.aab

    # 📦 4. UPLOAD DRIVER AAB (FOR GOOGLE PLAY)
    - name: Upload Driver App Bundle
      uses: actions/upload-artifact@v4
      with:
        name: driver-app-release-aab
        path: apps/driver-app/build/outputs/bundle/release/*.aab

    # 📲 5. UPLOAD DIRECT INSTALLABLE DRIVER APK
    - name: Upload Driver App APK (Direct Install)
      uses: actions/upload-artifact@v4
      with:
        name: driver-app-release-apk
        path: apps/driver-app/build/outputs/apk/release/*.apk
      if: always()

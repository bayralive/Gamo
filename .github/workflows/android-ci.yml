name: Imperial Production Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore from Secrets
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android_keystore.jks

    - name: Build and Sign Customer Release Bundle (.aab)
      run: ./gradlew :apps:customer-app:bundleRelease -Pandroid.injected.signing.storeFile=$(pwd)/android_keystore.jks -Pandroid.injected.signing.storePassword="${{ secrets.RELEASE_PASSWORD }}" -Pandroid.injected.signing.keyAlias="${{ secrets.RELEASE_ALIAS }}" -Pandroid.injected.signing.keyPassword="${{ secrets.RELEASE_KEY_PASSWORD }}" --stacktrace

    - name: Upload Signed Customer App Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: customer-app-release-aab
        path: apps/customer-app/build/outputs/bundle/release/*.aab

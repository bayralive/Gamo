name: Imperial Production Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Customer Release Bundle (.aab)
      run: ./gradlew :apps:customer-app:bundleRelease --stacktrace

    - name: Upload Customer App Bundle (.aab)
      uses: actions/upload-artifact@v3
      with:
        name: customer-app-release-aab
        path: apps/customer-app/build/outputs/bundle/release/*.aab

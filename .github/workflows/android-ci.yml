name: Imperial Production Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore from Secrets
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android_keystore.jks

    - name: Build Customer Release Bundle (.aab)
      run: ./gradlew :apps:customer-app:bundleRelease --stacktrace

    - name: Cryptographically Sign AAB with jarsigner
      run: |
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore android_keystore.jks \
          -storepass "${{ secrets.RELEASE_PASSWORD }}" \
          -keypass "${{ secrets.RELEASE_KEY_PASSWORD }}" \
          apps/customer-app/build/outputs/bundle/release/*.aab \
          "${{ secrets.RELEASE_ALIAS }}"

    - name: Verify AAB Signature
      run: jarsigner -verify -verbose -certs apps/customer-app/build/outputs/bundle/release/*.aab

    - name: Upload Signed Customer App Bundle (.aab)
      uses: actions/upload-artifact@v4
      with:
        name: customer-app-release-aab
        path: apps/customer-app/build/outputs/bundle/release/*.aab
